
name: RAG quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Capstone_Project_HPPCS02/Codebase/requirements-rag.txt

      - name: Run unit tests
        working-directory: Capstone_Project_HPPCS02/Codebase
        run: python -m pytest -q

      - name: Skip retrieval evaluation until test index is configured
        run: |
          echo "Unit tests completed."
          echo "Retrieval evaluation requires an indexed test dataset."


